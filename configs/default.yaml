defaults:
  - hydra@hydra.config: default
  - _self_

experiment_name: latstylegan_default
seed: 0
dry_run: false

n_qubits: 4
n_layers: 2
ansatz_type: simple
readout: single

training:
  max_iterations: 100
  batch_size: 64
  latent_dim: 8
  generator_lr: 0.0001
  discriminator_lr: 0.0001
  n_critic: 5
  gradient_penalty: 10.0
  checkpoint_every: 500
  eval_every: 100
  n_eval_samples: 1000
