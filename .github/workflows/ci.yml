name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff check
        run: uv run ruff check src/

      - name: Mypy
        run: uv run mypy src/

  tests:
    name: Tests (not slow, not hardware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest -m "not slow and not hardware" tests/

  cli-dry-run:
    name: CLI --dry-run Chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Install CLI
        run: uv pip install -e .

      - name: Manifest command
        run: mqs-molecule-generation manifest-cmd

      - name: Train dry-run simple
        run: mqs-molecule-generation train --dry-run --seeds 0 --ansatz simple --n-qubits 2 --n-layers 1 --max-iters 5

      - name: Train dry-run bel
        run: mqs-molecule-generation train --dry-run --seeds 0 --ansatz bel --n-qubits 2 --n-layers 1 --max-iters 5

      - name: Train dry-run chain
        run: mqs-molecule-generation train --dry-run --chain --seeds 0 --ansatz simple --n-qubits 2 --n-layers 1

      - name: Eval dry-run
        run: mqs-molecule-generation eval --dry-run

      - name: Eval chain
        run: mqs-molecule-generation eval --chain
