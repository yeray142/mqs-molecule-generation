[project]
name = "mqs-molecule-generation"
version = "0.1.0"
description = "Latent Style-based Quantum Wasserstein GAN for Drug Design (arXiv:2603.22399)"
authors = [{ name = "yeray142", email = "yeraycorderocarrasco@gmail.com" }]
requires-python = ">=3.12"
readme = "README.md"
homepage = "https://arxiv.org/abs/2603.22399"

[dependency-groups]
core = [
    "hydra-core>=1.3.0",
    "rdkit>=2024.3.0",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "gitpython>=3.1.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0.0",
    "pennylane[pytorch]>=0.38.0",
]
pennylane = [
    "pennylane>=0.38.0",
    "pennylane-qiskit>=0.38.0",
    "qiskit>=1.0.0",
]
hardware = [
    "qiskit-ibm-runtime>=0.28.0",
]
moses = []
storage = [
    "boto3>=1.34.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
mqs-molecule-generation = "mqs_molecule_generation.cli.commands:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "hardware: marks tests that require quantum hardware credentials",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true
show_column_numbers = true
pretty = true
color_output = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "C901", "SIM102"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B011", "PLR0913"]
